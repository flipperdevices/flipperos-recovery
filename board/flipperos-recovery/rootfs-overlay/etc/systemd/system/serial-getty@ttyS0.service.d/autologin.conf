# Recovery convenience: auto-login root on the serial console. The kernel cmdline
# puts the console on ttyS0 @ 1500000 (console=ttyS0,1500000n8); systemd's
# getty-generator instantiates serial-getty@ttyS0 from that, and this drop-in
# swaps its agetty for an --autologin one. --keep-baud preserves whatever baud
# the kernel handed over (so it works at 1500000 and slower fallbacks alike).
# root's password is still set (flipperone) for SSH and for `login` elsewhere.
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin root --noreset --noclear --keep-baud 1500000,115200,57600,38400,9600 - ${TERM}
