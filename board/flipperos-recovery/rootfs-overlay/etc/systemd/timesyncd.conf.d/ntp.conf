# Explicit NTP sources so a dead RTC battery does not break TLS (curl'ing recovery
# images fails if the clock is wrong). Not left to systemd's compile-time fallback.
# Only helps with an internet uplink (end0); the br0 AP/USB side has no gateway, so
# offline set the clock by hand: timedatectl set-time "YYYY-MM-DD HH:MM:SS".
[Time]
NTP=pool.ntp.org time.cloudflare.com
FallbackNTP=time1.google.com time2.google.com time3.google.com time4.google.com
