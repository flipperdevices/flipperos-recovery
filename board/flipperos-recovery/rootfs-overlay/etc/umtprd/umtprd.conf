# uMTP-Responder config for recovery. usb-gadget-setup.sh --mtp mounts FunctionFS
# at /dev/ffs-mtp and launches umtprd, which serves the storage below over MTP.
# Recovery exposes a RAM scratch area (tmpfs, see mnt-mtp.mount) so a connected
# computer can drag files to/from the running recovery system.

loop_on_disconnect 1

# storage "PATH" "NAME" "options"
storage "/mnt/mtp" "RAM-Disk" "rw"

manufacturer "Flipper FZCO"
product "Flipper One Recovery"
serial "0123456789AB"
firmware_version "Rev A"
interface "MTP"

usb_class 0x6
usb_subclass 0x1
usb_protocol 0x1

# FunctionFS mode; endpoint paths match the mount in usb-gadget-setup.sh (/dev/ffs-mtp).
usb_functionfs_mode 0x1
usb_dev_path   "/dev/ffs-mtp/ep0"
usb_epin_path  "/dev/ffs-mtp/ep1"
usb_epout_path "/dev/ffs-mtp/ep2"
usb_epint_path "/dev/ffs-mtp/ep3"
usb_max_packet_size 0x200
