[main]
dns=systemd-resolved

[connection]
connection.mdns=2

# Connectivity check drives the timesync dispatcher (dispatcher.d/50-timesync):
# NM only reports "full" once this probe actually reaches the internet, which is
# the correct signal (a default route can lead nowhere - dead gateway / captive
# portal). Must be HTTP, not HTTPS: it gates the time sync, so it cannot depend on
# a correct clock. 204 = connected. Swap the URI if gstatic is undesirable.
[connectivity]
uri=http://connectivitycheck.gstatic.com/generate_204
interval=300
