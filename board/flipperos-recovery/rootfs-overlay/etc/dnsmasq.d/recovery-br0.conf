# DHCP only (DNS disabled: systemd-resolved owns :53). Serve the recovery LAN on
# br0 (10.0.0.0/24, gateway address 10.0.0.1). Crucially, hand out NO default
# gateway (option 3) and NO DNS (option 6): clients get an address to reach
# 10.0.0.1 but keep their own internet route.
port=0
interface=br0
bind-dynamic
dhcp-range=10.0.0.10,10.0.0.100,255.255.255.0,1h
dhcp-option=3
dhcp-option=6
